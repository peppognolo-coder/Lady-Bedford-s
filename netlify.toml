[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Il service worker non deve restare in cache del browser, altrimenti gli aggiornamenti arrivano in ritardo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
